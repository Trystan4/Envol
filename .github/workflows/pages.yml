name: Tests et déploiement

# Every push and pull request is tested. Only a push to main whose tests pass is deployed:
# a broken deck or engine never reaches the phone.
# Public repository: GitHub-hosted runner minutes are free and do not count against any quota.
# Actions are pinned to a commit (tag in comment) so a moved tag cannot change what runs here; all of
# them run on Node 24. The runner image is pinned too: a new Ubuntu may not be supported yet by
# "playwright install --with-deps", and deployments must not break on their own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fiches, moteur et parcours
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails fast, with a message pointing at the file and question to fix.
      - run: pnpm check:deck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Mise en ligne (GitHub Pages)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A deployment in progress is never cancelled halfway; the next one waits its turn.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Only src/ is published: tests, tools and docs stay in the repository.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
